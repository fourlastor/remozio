name: Checks
# Fork-only measurement for rock3r/remozio#684. Never sent upstream.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mac-core:
    name: Mac core pacing test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compatible Mac build cache
        id: build-cache-key
        run: python3 scripts/ci-build-cache.py key --scope mac --github-output "$GITHUB_OUTPUT"
      - name: Restore Mac compiler outputs
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.restore-prefix }}
      - name: Restore timestamps of unchanged Mac inputs
        env:
          REMOZIO_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: python3 scripts/ci-build-cache.py restore --scope mac
      - name: Build macos/core tests
        id: build
        run: swift build --build-tests --package-path macos/core --triple arm64-apple-macosx26.0 -Xswiftc -O
      - name: Run GatewayDeliveryCoordinatorTests once
        run: |
          bundle=$(ls -d "$(swift build --package-path macos/core --triple arm64-apple-macosx26.0 -Xswiftc -O --show-bin-path)"/*.xctest)
          xcrun xctest -XCTest RemozioCoreTests.GatewayDeliveryCoordinatorTests "$bundle" > .build/coordinator.log 2>&1 || status=$?
          tail -40 .build/coordinator.log
          exit "${status:-0}"
      - name: Repeat the fixed test and the old measurement concurrently
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bundle=$(ls -d "$(swift build --package-path macos/core --triple arm64-apple-macosx26.0 -Xswiftc -O --show-bin-path)"/*.xctest)
          mkdir -p .build/pacing
          repeat() {
            failures=0
            for i in $(seq 1 "$2"); do
              if ! xcrun xctest -XCTest "RemozioCoreTests.GatewayDeliveryCoordinatorTests/$1" "$bundle" > ".build/pacing/$1-$3-$i.log" 2>&1; then
                failures=$((failures + 1))
                grep -E "error:|XCTAssert" ".build/pacing/$1-$3-$i.log" | head -3
              fi
            done
            echo "$1 ($3): $failures failures in $2 runs"
          }
          repeat testConcurrencyLimitDuplicateAndPacingAcrossCandidates 300 fixed > .build/pacing/fixed.txt &
          repeat testControlProviderSampledPacing 300 control1 > .build/pacing/control-1.txt &
          repeat testControlProviderSampledPacing 300 control2 > .build/pacing/control-2.txt &
          wait
          cat .build/pacing/fixed.txt .build/pacing/control-1.txt .build/pacing/control-2.txt
          grep -q "(fixed): 0 failures" .build/pacing/fixed.txt
