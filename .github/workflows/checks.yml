name: Checks
# Fork-only measurement of the Mac core tests job. Never sent upstream.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mac-core:
    name: Mac core tests
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compatible Mac build cache
        id: build-cache-key
        run: python3 scripts/ci-build-cache.py key --scope mac --github-output "$GITHUB_OUTPUT"
      - name: Restore Mac compiler outputs
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.restore-prefix }}
      - name: Restore timestamps of unchanged Mac inputs
        env:
          REMOZIO_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: python3 scripts/ci-build-cache.py restore --scope mac
      # Fork-only paired measurement: one build, then both shard layouts on this runner, methods first.
      - name: Run macos/core tests in both shard layouts (methods first)
        run: |
          python3 -c 'import json, os; d = json.load(open(".github/macos-core-test-weights.json")); d.pop("methods"); json.dump(d, open(os.environ["RUNNER_TEMP"] + "/weights-classes.json", "w"))'
          layout() {
            case "$1" in
              classes) weights="$RUNNER_TEMP/weights-classes.json" ;;
              methods) weights=.github/macos-core-test-weights.json ;;
            esac
            echo "=== layout $1 started $(date -u +%H:%M:%S)"
            python3 scripts/run-xctest-shards.py --package-path macos/core \
              --weights "$weights" --shards 3 --concurrent --app-dependent exclude \
              --allowed-skips RemozioCoreTests.LiveOwnedJobInspectionTests/testOwnedGUIJobReconciliation \
              --log-dir ".build/xctest-shards/$1" \
              -- --triple arm64-apple-macosx26.0 -Xswiftc -O
            status=$?
            echo "=== layout $1 finished $(date -u +%H:%M:%S) exit $status"
            return $status
          }
          failed=0
          for name in methods classes; do layout "$name" || failed=1; done
          exit $failed
      - name: Retain shard logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-core-shards-${{ github.run_attempt }}
          path: .build/xctest-shards/
          if-no-files-found: ignore
          retention-days: 7
