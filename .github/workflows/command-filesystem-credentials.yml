name: Native command filesystem credentials
on:
  pull_request:
    branches: [main]
    paths:
      - 'macos/core/Sources/RemozioCore/CommandFilesystemCapture.swift'
      - 'macos/core/Sources/RemozioCore/CommandFilesystemProbePool.swift'
      - '.github/workflows/command-filesystem-credentials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  command-filesystem-credentials:
    name: Privileged command filesystem fixture
    # Only trusted repository branches run privileged code on this disposable VM.
    if: >-
      github.repository == 'rock3r/remozio' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
    runs-on: macos-26
    # A warm build takes a few minutes; the margin covers a cold build when main has no usable Mac cache entry.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Reuses the Mac build job's compiler outputs. Only main's Checks runs save that entry, so this job, which runs
      # the bundle as root, only reads outputs that main produced. It builds with the same flags and the default
      # scratch path as the Mac core tests stage, so a warm entry makes the build incremental.
      - name: Identify compatible Mac build cache
        id: build-cache-key
        run: python3 scripts/ci-build-cache.py key --scope mac --github-output "$GITHUB_OUTPUT"
      - name: Restore Mac compiler outputs
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.restore-prefix }}
      - name: Restore timestamps of unchanged Mac inputs
        env:
          REMOZIO_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: python3 scripts/ci-build-cache.py restore --scope mac
      - name: Build the fixed fixture as the runner user
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(id -u)" -ne 0
          git diff --exit-code HEAD
          swift build --package-path macos/core --triple arm64-apple-macosx26.0 -Xswiftc -O --build-tests
          products="$(swift build --package-path macos/core --triple arm64-apple-macosx26.0 -Xswiftc -O --show-bin-path)"
          shopt -s nullglob
          bundles=("$products"/*.xctest)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          binary="${bundle##*/}"
          test -x "$bundle/Contents/MacOS/${binary%.xctest}"
          printf 'REMOZIO_FIXTURE_BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"
      - name: Run the fixed credential fixture
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          report="$(mktemp "$RUNNER_TEMP/remozio-credential-result.XXXXXXXX")"
          /usr/bin/sudo -n -- /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/var/root LC_ALL=C \
            "REMOZIO_CREDENTIAL_FIXTURE_UID=$uid" "REMOZIO_CREDENTIAL_FIXTURE_GID=$gid" \
            /usr/bin/xcrun xctest -XCTest RemozioCoreTests.CommandFilesystemCaptureTests/testCredentialResetSentinelsMatchDarwin \
            "$REMOZIO_FIXTURE_BUNDLE" > "$report" 2>&1 || { cat "$report"; exit 1; }
          grep -Fxq 'Remozio privileged filesystem fixture passed' "$report"
          {
            printf 'Privileged filesystem credential fixture passed on macOS %s.\n\n' "$(sw_vers -productVersion)"
            printf 'Source commit: `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
