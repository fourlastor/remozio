name: Compiler output benchmark

on:
  push:
    branches: [codex/ci-logging-benchmark]

permissions:
  contents: read

concurrency:
  group: compiler-output-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare-output:
    # This experiment is deliberately confined to the owner's fork.
    if: github.repository == 'fourlastor/remozio'
    name: Compare compiler output on one Mac
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare streamed, captured and quiet builds
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 scripts/benchmark-compiler-output.py \
            --package-path experiments/release-dependencies \
            --output .build/compiler-output-benchmark \
            --jobs 4 \
            --triple arm64-apple-macosx26.0
      - name: Retain measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/compiler-output-benchmark/*.json
            .build/compiler-output-benchmark/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
