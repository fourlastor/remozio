name: Core test profile
on:
  push:
    branches: [codex/core-test-performance]
permissions:
  contents: read
concurrency:
  group: core-test-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    if: github.repository == 'fourlastor/remozio'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record host and build the native tests
        run: |
          mkdir -p .build/core-test-profile
          {
            git rev-parse HEAD
            sw_vers
            xcodebuild -version
            swift --version
          } > .build/core-test-profile/host.txt
          set -o pipefail
          /usr/bin/time -lp swift build --package-path macos/core --build-tests \
            --triple arm64-apple-macosx26.0 --jobs 4 --force-resolved-versions \
            2>&1 | tee .build/core-test-profile/build.log
      - name: Profile the nine gateway activation tests serially
        run: |
          set -o pipefail
          REMOZIO_TEST_PROFILE_DIR="$GITHUB_WORKSPACE/.build/core-test-profile" \
            /usr/bin/time -lp swift test --package-path macos/core --skip-build \
            --triple arm64-apple-macosx26.0 --jobs 4 --force-resolved-versions \
            --no-parallel --filter GatewayRuntimeActivationOperationTests \
            2>&1 | tee .build/core-test-profile/tests.log
      - name: Check the focused test count
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          log = Path('.build/core-test-profile/tests.log').read_text()
          if not re.search(r'Executed 9 tests, with 0 failures', log):
              raise SystemExit('Expected all nine focused tests, with no skips or failures')
          PYTHON
      - name: Retain profile and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-test-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/core-test-profile/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
