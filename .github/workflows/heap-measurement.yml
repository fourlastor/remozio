name: Heap measurement
on:
  push:
    branches: [measure/gradle-heap]
permissions:
  contents: read
jobs:
  mac-client:
    name: Mac client stage heap
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HEAPS: '4g'
      TASKS: >-
        :protocol-kotlin:jvmTest :phone-pairing:jvmTest :phone-core:test :phone-ui:jvmTest :dev-invitation:test
        :protocol-kotlin:iosSimulatorArm64Test :phone-pairing:iosSimulatorArm64Test :phone-ui:iosSimulatorArm64Test
        :android-app:testDebugUnitTest :android-app:assembleDebug :android-app:lintDebug :android-app:assembleRelease
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Describe the runner
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          xcodebuild -version
      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Measure cold client builds
        run: |
          mkdir -p "$RUNNER_TEMP/heap"
          first=1
          for heap in $HEAPS; do
            out="$RUNNER_TEMP/heap/$heap"; mkdir -p "$out"
            if [ "$first" = 1 ]; then guh="$HOME/.gradle"; ro=""; else guh="$RUNNER_TEMP/guh-$heap"; ro="$HOME/.gradle/caches"; fi
            rm -rf .gradle/configuration-cache
            start=$(date +%s)
            set +e
            GRADLE_USER_HOME="$guh" GRADLE_RO_DEP_CACHE="$ro" KONAN_DATA_DIR="$RUNNER_TEMP/konan-$heap" \
              ./gradlew $TASKS --rerun-tasks --no-build-cache --console=plain \
              "-Dorg.gradle.jvmargs=-Xmx$heap -Dfile.encoding=UTF-8 -Xlog:gc*:file=$out/gradle-gc.log:uptime,tags" \
              "-Pkotlin.daemon.jvmargs=-Xmx$heap -Xlog:gc*:file=$out/kotlin-gc.log:uptime,tags" > "$out/build.log" 2>&1
            rc=$?
            set -e
            echo "heap $heap: exit $rc in $(( $(date +%s) - start ))s" | tee -a "$RUNNER_TEMP/heap/summary.txt"
            tail -25 "$out/build.log"
            GRADLE_USER_HOME="$guh" ./gradlew --stop > /dev/null 2>&1 || true
            pkill -f '[k]otlin-daemon' || true
            first=0
          done
      - name: Keep the GC logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heap-measurement
          path: ${{ runner.temp }}/heap
          retention-days: 7
