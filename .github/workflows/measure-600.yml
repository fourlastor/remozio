name: Reproduce native dispatch cleanup flake (#600)
on:
  push:
    branches: [measure/native-dispatch-600]
permissions:
  contents: read
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the Core tests
        run: swift build --package-path macos/core --triple arm64-apple-macosx26.0 --build-tests
      - name: Loop the native dispatch tests
        run: |
          mkdir -p /tmp/m600
          for i in $(seq 1 25); do
            if ! swift test --skip-build --package-path macos/core --triple arm64-apple-macosx26.0 \
                --filter 'MachCommandCallerReceiverTests/testNativeDispatch' > /tmp/m600/run-$i.log 2>&1; then
              echo "iteration $i FAILED"; grep -E "error:|failed \(" /tmp/m600/run-$i.log | head -20
            else
              echo "iteration $i passed $(grep -c "' passed (" /tmp/m600/run-$i.log) cases"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: m600-${{ matrix.shard }}
          path: /tmp/m600/
