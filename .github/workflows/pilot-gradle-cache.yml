name: Pilot Gradle cache
on:
  push:
    branches: [perf/ci-gradle-cache-20261108]
permissions:
  contents: read
jobs:
  gradle:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Kotlin protocol
            job: kotlin
            tasks: ':protocol-kotlin:jvmTest :phone-pairing:jvmTest :phone-core:test :phone-ui:jvmTest :dev-invitation:test'
          - label: Android build
            job: android
            sdk: true
            tasks: ':android-app:testDebugUnitTest :android-app:assembleDebug :android-app:lintDebug :android-app:assembleRelease'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle downloads
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-v1-${{ matrix.job }}-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle/*.toml') }}
          restore-keys: gradle-v1-${{ matrix.job }}-${{ runner.os }}-
      - name: Install Android SDK packages
        if: matrix.sdk
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: ./gradlew ${{ matrix.tasks }}
      - name: Gradle download sizes
        run: du -sh ~/.gradle/wrapper/dists ~/.gradle/caches/modules-2 ~/.gradle/caches 2>/dev/null
      - name: Save Gradle downloads
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
