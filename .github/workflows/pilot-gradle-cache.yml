name: Pilot Gradle cache
on:
  push:
    branches: [perf/ci-gradle-cache-20261108]
permissions:
  contents: read
jobs:
  gradle:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Kotlin protocol
            tasks: ':protocol-kotlin:jvmTest :phone-pairing:jvmTest :phone-core:test :phone-ui:jvmTest :dev-invitation:test'
          - label: Android build
            sdk: true
            tasks: ':android-app:testDebugUnitTest :android-app:assembleDebug :android-app:lintDebug :android-app:assembleRelease'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: false
      - name: Install Android SDK packages
        if: matrix.sdk
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: ./gradlew ${{ matrix.tasks }}
      - name: Gradle User Home size
        if: always()
        run: du -sh ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/caches/* 2>/dev/null | sort -h | tail -12
