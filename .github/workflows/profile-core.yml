name: Profile core fixtures
on:
  push:
    branches: ['profile/**']
jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [change]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
      - name: Select sources
        if: matrix.flavor == 'base'
        run: git checkout HEAD~2 -- macos/core && git log -3 --oneline
      - name: Build tests
        run: swift build --package-path macos/core --build-tests --triple arm64-apple-macosx26.0 -Xswiftc -O
      - name: Run changed tests
        if: matrix.flavor == 'change'
        run: |
          bundle=$(find macos/core/.build -name '*PackageTests.xctest' -maxdepth 4 | head -1)
          for t in RemozioCoreTests.PreparationImmutableValidationCacheTests RemozioCoreTests.PreparationImmutableTupleDecodeCacheTests \
            RemozioCoreTests.MachineUpdateReplacementTests/testInstalledReleaseArchiveRequiresAllFilesAndFreshPairedPolicy \
            RemozioCoreTests.MachineUpdateRetainedSetupMaterialValueTests; do
            echo "--- $t"
            status=0; "$(xcrun -f xctest)" -XCTest "$t" "$bundle" > test.log 2>&1 || status=$?
            grep -E "error|failed|passed \(|Executed" test.log | tail -40 || true
            test "$status" -eq 0
          done
      - name: Trace with a hang watchdog
        run: |
          bundle=$(find macos/core/.build -name '*PackageTests.xctest' -maxdepth 4 | head -1)
          xctest=$(xcrun -f xctest)
          mkdir -p prof
          t=$(head -1 scripts/profile/methods.txt)
          for attempt in 1 2 3; do
            xcrun xctrace record --template 'Time Profiler' --output "prof/t$attempt.trace" --no-prompt --target-stdout "prof/out$attempt.log" \
              --launch -- "$xctest" -XCTest "$t" "$bundle" > "prof/trace$attempt.log" 2>&1 &
            tracer=$!; waited=0
            while kill -0 $tracer 2>/dev/null && [ $waited -lt 150 ]; do sleep 3; waited=$((waited+3)); done
            if kill -0 $tracer 2>/dev/null; then
              echo "=== HUNG under xctrace (attempt $attempt) after ${waited}s"
              ps -axo pid,ppid,stat,etime,command | grep -vE "grep|ps -axo" | grep -E "xctest|xctrace|Remozio|PackageTests" | cut -c1-200
              roots=$(pgrep -f "PackageTests.xctest"); all="$roots"
              for r in $roots; do all="$all $(pgrep -P $r | tr '\n' ' ')"; done
              for pid in $all; do
                echo "--- sampling pid $pid: $(ps -o state=,etime=,command= -p $pid | cut -c1-160)"
                sample $pid 5 -file "prof/hang$attempt-$pid.txt" >/dev/null 2>&1 || sudo sample $pid 5 -file "prof/hang$attempt-$pid.txt" >/dev/null 2>&1 || true
              done
              grep -E "passed \(|failed \(|started" "prof/out$attempt.log" | tail -5 || true
              pkill -9 -f "PackageTests.xctest" || true; kill -9 $tracer 2>/dev/null || true; sudo pkill -9 xctrace || true
              sleep 3
            else
              echo "=== done under xctrace (attempt $attempt) in ${waited}s"; grep -E "passed \(|failed \(" "prof/out$attempt.log" || echo "no test result lines"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-profile-${{ matrix.flavor }}
          path: |
            prof/*.log
            prof/*.txt
          retention-days: 7
