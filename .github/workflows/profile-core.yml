name: Profile core fixtures
on:
  push:
    branches: ['profile/**']
jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, change]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
      - name: Select sources
        if: matrix.flavor == 'base'
        run: git checkout HEAD~2 -- macos/core && git log -3 --oneline
      - name: Build tests
        run: swift build --package-path macos/core --build-tests --triple arm64-apple-macosx26.0 -Xswiftc -O
      - name: Run changed tests
        if: matrix.flavor == 'change'
        run: |
          bundle=$(find macos/core/.build -name '*PackageTests.xctest' -maxdepth 4 | head -1)
          for t in RemozioCoreTests.PreparationImmutableValidationCacheTests RemozioCoreTests.PreparationImmutableTupleDecodeCacheTests \
            RemozioCoreTests.MachineUpdateReplacementTests/testInstalledReleaseArchiveRequiresAllFilesAndFreshPairedPolicy \
            RemozioCoreTests.MachineUpdateRetainedSetupMaterialValueTests; do
            echo "--- $t"
            status=0; "$(xcrun -f xctest)" -XCTest "$t" "$bundle" > test.log 2>&1 || status=$?
            grep -E "error|failed|passed \(|Executed" test.log | tail -40 || true
            test "$status" -eq 0
          done
      - name: Run methods with a hang watchdog
        run: |
          bundle=$(find macos/core/.build -name '*PackageTests.xctest' -maxdepth 4 | head -1)
          xctest=$(xcrun -f xctest)
          mkdir -p prof
          n=0
          while read -r t; do
            [ -z "$t" ] && continue
            for attempt in 1 2 3 4 5 6 7 8; do
              n=$((n+1))
              "$xctest" -XCTest "$t" "$bundle" > "prof/run$n.log" 2>&1 &
              pid=$!; waited=0
              while kill -0 $pid 2>/dev/null && [ $waited -lt 120 ]; do sleep 2; waited=$((waited+2)); done
              if kill -0 $pid 2>/dev/null; then
                echo "=== HUNG $t (attempt $attempt) after ${waited}s"
                sudo sample $pid 5 -file "prof/hang$n.txt" >/dev/null 2>&1 || sample $pid 5 -file "prof/hang$n.txt" >/dev/null 2>&1 || true
                kill -9 $pid; wait $pid 2>/dev/null || true
                grep -E "^ +[0-9]+ Thread_|^Call graph" -A0 "prof/hang$n.txt" | head -20 || true
              else
                wait $pid || true
                [ "$attempt" = 8 ] && { xcrun xctrace record --template 'Time Profiler' --output "prof/t$n.trace" --no-prompt --time-limit 180s \
                  --launch -- "$xctest" -XCTest "$t" "$bundle" > "prof/trace$n.log" 2>&1; echo "xctrace exit $? for $t"; grep -E "passed \(|failed \(" "prof/trace$n.log"; } || true
                echo "=== done $t (attempt $attempt) in ${waited}s"; grep -E "passed \(|failed \(|error:" "prof/run$n.log" | head -10
              fi
            done
          done < scripts/profile/methods.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-profile-${{ matrix.flavor }}
          path: |
            prof/*.log
            prof/*.txt
          retention-days: 7
