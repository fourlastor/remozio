org.gradle.caching=true
org.gradle.configuration-cache=true
# A cold Mac client stage (Kotlin/Native for iOS and the Android build in one daemon) keeps about 2 GB live and
# 541 MB of metaspace (#629). 3 GB leaves a margin and, with the Kotlin daemon, still fits a 7 GB macOS runner.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Without this the Kotlin daemon inherits the Gradle daemon's heap. It peaked near 1 GB.
kotlin.daemon.jvmargs=-Xmx2g
