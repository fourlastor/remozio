# Source of ios/Remozio.xcodeproj. After a change here, run `xcodegen` in this folder and commit both.
name: Remozio
options:
  bundleIdPrefix: dev.remozio
  deploymentTarget:
    iOS: "18.5"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The team is passed at build time (DEVELOPMENT_TEAM=...), never committed.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Remozio:
    type: application
    platform: iOS
    sources:
      - path: Remozio
    info:
      path: Remozio/Info.plist
      properties:
        CFBundleDisplayName: Remozio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Remozio uses the camera to scan the pairing QR code that your computer shows.
        # Compose Multiplatform requires this key on ProMotion devices.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.remozio.ios
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../phone/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, RemozioUI]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin targets are iosArm64 and iosSimulatorArm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null) || {
              echo "error: set JAVA_HOME to a JDK 21 before building" >&2; exit 1; }
            export JAVA_HOME
          fi
          cd "$SRCROOT/.."
          ./gradlew :phone-ui:embedAndSignAppleFrameworkForXcode
